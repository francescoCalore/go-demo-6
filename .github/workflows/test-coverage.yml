name: CI / Test Coverage

# 1. Define when this workflow should run
on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

# 2. Define the jobs
jobs:
  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest

    steps:
      # Step A: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Set up the Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your project's Node version
          cache: 'npm'       # Speeds up subsequent runs by caching dependencies

      # Step C: Install dependencies reliably
      - name: Install Dependencies
        run: npm ci

      # Step D: Run the tests with coverage
      - name: Run Tests and Generate Coverage
        run: npx jest --coverage --passWithNoTests

      # Step E: Upload the coverage report so you can view it later (Optional but recommended)
      # NEW: Upload the generated report directly to Codecov
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Pulls the token securely from GitHub Secrets
          fail_ci_if_error: true # Fails the workflow if Codecov fails to upload